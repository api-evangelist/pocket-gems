aid: pocket-gems
name: Pocket Gems
description: 'Pocket Gems is a San Francisco mobile games and interactive entertainment
  studio founded in 2009, employing over 200 people and backed by Sequoia Capital and
  Tencent. It builds and operates the Episode interactive-storytelling network, Episode
  XOXO, and the 3D real-time strategy title War Dragons on its proprietary mobile-first
  Mantis Engine, with products downloaded more than 325 million times. Pocket Gems ships
  consumer mobile applications rather than a developer-facing API program: there is no
  public developer portal, API reference, or machine-readable specification. Its public
  developer surface is a GitHub organization and four first-party Apache-2.0 Node.js
  libraries published to npm under the @pocketgems scope (the internal "Todea" service
  stack), plus an Episode Writer''s Portal used by story authors.'
